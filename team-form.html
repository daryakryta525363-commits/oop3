
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создание команды — Dota Heroes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 50px auto;
            padding: 0 20px;
            background: #f4f6f9;
            color: #202938;
        }
        form, .panel {
            background: white;
            padding: 24px;
            border-radius: 10px;
        }
        label { display: block; margin-bottom: 8px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ccd2dc;
            border-radius: 6px;
        }
        button, a {
            display: inline-block;
            padding: 11px 16px;
            border: 0;
            border-radius: 6px;
            background: #3549a3;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .secondary { background: #687386; }
        .error { color: #b42318; }
    </style>
</head>
<body>

<h1>Создать команду</h1>
<p>Укажи название новой команды.</p>

<form th:action="@{/teams}" method="post">
    <label for="name">Название команды</label>
    <input id="name"
           name="name"
           type="text"
           maxlength="150"
           placeholder="Например, Radiant"
           required>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <button type="submit">Сохранить команду</button>
    <a class="secondary" th:href="@{/teams}">Отмена</a>
</form>

</body>
</html>
